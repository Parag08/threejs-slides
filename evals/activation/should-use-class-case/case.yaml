schema_version: "1.1"
name: should-use-class-case
description: The skill activates for a request it is meant for.
tags: [activation, positive]
runs: 1
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob]
  prompt: |
    Create an interactive browser presentation for my MBA class case discussion on a retail company turnaround. Make it animated.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?threejs-slides"'
    min: 1
    arm: both
