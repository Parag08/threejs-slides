schema_version: "1.1"
name: should-not-use-threejs-game
description: The skill stays out of a request it is not meant for.
tags: [activation, negative]
runs: 1
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob]
  prompt: |
    Write a small Three.js game where a cube jumps over obstacles.
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?threejs-slides"'
    min: 0
    max: 0
    arm: both
