schema_version: "1.1"
name: should-use-webgl-wow
description: The skill activates for a request it is meant for.
tags: [activation, positive]
runs: 1
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob]
  prompt: |
    I want a "wow" presentation for demo day, something with WebGL and motion, not boring slides. Topic: our climate-data dashboard.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?threejs-slides"'
    min: 1
    arm: both
