schema_version: "1.1"
name: should-use-outline-convert
description: The skill activates for a request it is meant for.
tags: [activation, positive]
runs: 1
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob]
  prompt: |
    Convert this outline into an animated presentation with a globe on the markets slide:
    1. Problem
    2. Markets: India, Brazil, Kenya
    3. Plan
    4. Ask
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?threejs-slides"'
    min: 1
    arm: both
