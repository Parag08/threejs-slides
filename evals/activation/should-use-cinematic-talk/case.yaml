schema_version: "1.1"
name: should-use-cinematic-talk
description: The skill activates for a request it is meant for.
tags: [activation, positive]
runs: 1
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob]
  prompt: |
    Turn these notes into a cinematic, keynote-style presentation that runs in the browser:
    - why caching matters
    - three cache layers we use
    - what we learned
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?threejs-slides"'
    min: 1
    arm: both
